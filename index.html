<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markdown Slides</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top">
<b>Markdown Slides</b>
<div class="right">
<span id="saveStatus">Saved</span>
<button id="saveBtn">Save</button>
<button id="presentBtn">Present</button>
</div>
</div>

<div id="editorView">
<div class="box">
<h2>Write Markdown</h2>
<p>Use --- for a new slide</p>
<textarea id="markdownInput" spellcheck="false"></textarea>
<div class="bottomline">
<span>Markdown file</span>
<span id="slideCountEditor">3 slides</span>
</div>
</div>

<div class="box">
<h2>Live Preview</h2>
<p>Updates as you type</p>
<div class="stage">
<div id="previewSlide" class="slide"></div>
</div>
<div class="buttons">
<button id="prevPreview">Left</button>
<button id="nextPreview">Right</button>
<button id="fullscreenPreview">Full Screen</button>
<span id="previewCounter">1 / 3</span>
</div>
</div>
</div>

<div id="presentationView" style="display:none">
<div id="presentationSlide" class="slide bigslide"></div>
<div class="buttons">
<button id="prevPresentation">Left</button>
<button id="nextPresentation">Right</button>
<button id="fullscreenPresentation">Full Screen</button>
<span id="presentationCounter">1 / 3</span>
<button id="backToEditor">Close</button>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
